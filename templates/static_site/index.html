{% extends "base.html" %}
{% block title %}Eco &amp; Evo Jobs{% endblock %}
{% block body_class %}page-index{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<link rel="alternate" type="application/rss+xml" title="Eco &amp; Evo Jobs — New this Week" href="{{ base_path }}feed-week.xml">
<link rel="alternate" type="application/rss+xml" title="Eco &amp; Evo Jobs — All time" href="{{ base_path }}feed-all.xml">
{% endblock %}
{% block content %}
<section class="toolbar">
  <div class="toolbar-secondary">
    <div class="toolbar-top">
      <div class="filter-stack-wrap" id="filter-stack-wrap">
        <div class="clause-list" id="clause-list"></div>
        <div class="filter-stack" id="filter-stack"></div>
      </div>
      <div class="date-range-panel" id="date-range-panel">
        <div class="date-range-slider" id="date-range-slider">
          <div class="date-range-field" role="group" aria-label="Timeline date">
            <button type="button" class="date-range-field-btn is-active" data-field="posted_at" aria-pressed="true">Posted</button>
            <button type="button" class="date-range-field-btn" data-field="apply_by" aria-pressed="false">Deadline</button>
          </div>
          <div class="date-range-track-wrap">
            <div class="date-range-notches" id="date-range-notches" aria-hidden="true"></div>
            <div class="date-range-histogram" id="date-range-histogram" aria-hidden="true"></div>
            <div class="date-range-track">
              <div class="date-range-fill" id="date-range-fill"></div>
              <button type="button" class="date-range-thumb" id="date-thumb-min" aria-label="Range start"></button>
              <button type="button" class="date-range-thumb" id="date-thumb-max" aria-label="Range end"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar-bottom">
      <div class="clause-actions">
        <button type="button" class="clause-add-btn" id="clause-add-btn">Add</button>
        <button type="button" class="filter-stack-clear" id="filter-stack-clear">Clear</button>
        <button
          type="button"
          class="filter-toggle-btn is-active"
          id="open-jobs-toggle"
          aria-pressed="true"
          title="Show only jobs still accepting applications (or with no deadline listed)"
        >Open only</button>
        <button
          type="button"
          class="filter-toggle-btn is-active"
          id="new-jobs-btn"
          aria-pressed="true"
          title="Show only jobs posted in the last 7 days"
        >New this Week</button>
      </div>
      <div class="sort-panel">
        <div class="view-sort-btns" role="group" aria-label="Sort by">
          <button type="button" class="view-sort-btn is-active is-desc" data-sort="posted_at" aria-pressed="true" title="Sort by date posted">Posted<span class="view-sort-dir" aria-hidden="true"></span></button>
          <button type="button" class="view-sort-btn" data-sort="apply_by" aria-pressed="false" title="Sort by application deadline">Deadline<span class="view-sort-dir" aria-hidden="true"></span></button>
          <button type="button" class="view-sort-btn" data-sort="updated_at" aria-pressed="false" title="Sort by last updated">Updated<span class="view-sort-dir" aria-hidden="true"></span></button>
          <button type="button" class="view-sort-btn" data-sort="institution" aria-pressed="false" title="Sort by institution">Name<span class="view-sort-dir" aria-hidden="true"></span></button>
        </div>
        <input type="hidden" id="sort-filter" value="posted_at">
        <input type="hidden" id="order-filter" value="desc">
      </div>
    </div>
  </div>
</section>

<section class="jobs-map-layout">
  <div class="jobs-panel">
    <div class="jobs-panel-header">
      <p class="jobs-result-count" id="jobs-result-count" aria-live="polite">Loading…</p>
      <div class="jobs-header-actions">
        <div class="jobs-rss" id="jobs-rss">
          <button
            type="button"
            class="jobs-rss-toggle"
            id="jobs-rss-toggle"
            aria-expanded="false"
            aria-haspopup="true"
            aria-controls="jobs-rss-menu"
            title="RSS feeds"
          >RSS</button>
          <div class="jobs-rss-menu" id="jobs-rss-menu" role="menu" hidden>
            <a role="menuitem" href="{{ base_path }}feed-week.xml">New this Week</a>
            <a role="menuitem" href="{{ base_path }}feed-all.xml">All time</a>
          </div>
        </div>
        <button type="button" class="jobs-export-btn" id="export-csv-btn" title="Download currently shown jobs as CSV" aria-label="Download currently shown jobs as CSV">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M8 11l4 4 4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="jobs-list" id="jobs-list">
      <p class="empty-state" id="jobs-placeholder">Loading jobs…</p>
    </div>
  </div>
  <aside class="map-panel map-panel-sticky">
    <div id="job-map" class="job-map job-map-index" role="region" aria-label="Job locations map"></div>
    <p class="map-footnote" id="map-footnote">Loading map…</p>
    <p class="map-footnote-detail" id="map-footnote-detail" hidden></p>
  </aside>
</section>
{% endblock %}

{% block scripts %}
<script>
  window.JobBoardsPage = "index";
  window.JobBoardsHasPreview = false;
  window.JobBoardsInitialFilters = [];
</script>
<script src="{{ base_path }}static/js/date-range.js?v=quiet6"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="{{ base_path }}static/js/job-map.js"></script>
<script src="{{ base_path }}static/js/search-suggest.js?v=bool3"></script>
{% endblock %}
